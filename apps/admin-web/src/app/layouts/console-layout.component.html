<nz-layout class="console-shell">
  <nz-sider nzTheme="light" nzWidth="232">
    <a class="brand" routerLink="/app/overview" aria-label="RagHub Console">
      <span class="brand-mark"><img src="assets/logo.png" alt="" /></span>
      <span><strong>RAGHub</strong><small>Self-host Console</small></span>
    </a>
    <p class="nav-label">RagHub Console</p>
    <ul nz-menu nzTheme="light" nzMode="inline" aria-label="Điều hướng Console">
      <li nz-menu-item><a aria-label="Tổng quan" routerLink="/app/overview" routerLinkActive="active"><nz-icon nzType="dashboard" /><span>Tổng quan</span></a></li>
      <li nz-menu-item><a aria-label="Workspaces" routerLink="/app/workspaces" routerLinkActive="active"><nz-icon nzType="database" /><span>Workspace</span></a></li>
      @if (isAdmin()) {
        <li nz-menu-item><a routerLink="/app/ai-settings" routerLinkActive="active" aria-label="Cấu hình AI"><nz-icon nzType="setting" /><span>Cấu hình AI</span></a></li>
      }
      <li nz-menu-item><a routerLink="/system" routerLinkActive="active" aria-label="Hệ thống"><nz-icon nzType="team" /><span>Hệ thống</span></a></li>
      <li nz-menu-item><a routerLink="/app/profile" routerLinkActive="active" aria-label="Tài khoản"><nz-icon nzType="setting" /><span>Tài khoản</span></a></li>
    </ul>
    <footer><span class="user-dot">T</span><div><b>Tài khoản</b><small>Quản trị viên</small></div><a routerLink="/app/profile" aria-label="Mở thông tin tài khoản">›</a></footer>
  </nz-sider>
  <nz-layout class="console-main">
    <nz-header>
      <div class="header-context"><b>RagHub Console</b><small>Quản lý tri thức và chatbot của bạn</small></div>
      <div class="header-actions">
        <a routerLink="/app/profile" class="profile"><span class="user-dot">T</span><span><b>Tài khoản</b><small>Bảo mật & phiên đăng nhập</small></span></a>
      </div>
    </nz-header>
    <nz-content><div class="content-frame"><router-outlet /></div></nz-content>
  </nz-layout>
</nz-layout>
