<main class="auth-card">
  <p class="eyebrow">TÀI KHOẢN RAGHUB</p>
  <h1>{{ registerMode ? "Tạo tài khoản" : "Chào mừng trở lại" }}</h1>
  <p>
    {{ registerMode
      ? "Tạo tài khoản để quản lý không gian làm việc và tài liệu."
      : "Đăng nhập để quản lý không gian làm việc và tài liệu." }}
  </p>
  <form (ngSubmit)="submit()">
    <label
      >Email <input [(ngModel)]="email" name="email" type="email" autocomplete="email" required
    /></label>
    <label
      >Mật khẩu
      <input
        [(ngModel)]="password"
        name="password"
        type="password"
        [attr.autocomplete]="registerMode ? 'new-password' : 'current-password'"
        minlength="8"
        required
    /></label>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <button type="submit">
      {{ registerMode ? "Tạo tài khoản" : "Đăng nhập" }}
    </button>
  </form>
  <button class="link" type="button" (click)="toggleMode()">
    {{
      registerMode
        ? "Đã có tài khoản? Đăng nhập"
        : "Chưa có tài khoản? Đăng ký"
    }}
  </button>
</main>
