<main><section class="page-heading"><div><p class="eyebrow">KNOWLEDGE</p><h1>Documents</h1></div></section><p class="error">{{ error() }}</p>
  <section class="panel"><select [(ngModel)]="workspaceId" (change)="load()"><option value="">Select workspace</option>@for (workspace of workspaces(); track workspace.id) { <option [value]="workspace.id">{{ workspace.name }}</option> }</select><input #fileInput type="file" accept="application/pdf" /><button (click)="upload()">Upload PDF</button></section>
  <section class="panel"><table><thead><tr><th>Name</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody>@for (document of documents(); track document.id) { <tr><td>{{ document.name }}</td><td><span class="status">{{ document.status }}</span></td><td>{{ document.created_at | date:'medium' }}</td><td><button class="danger" (click)="remove(document)">Delete</button></td></tr> } @empty { <tr><td colspan="4">No documents yet.</td></tr> }</tbody></table></section></main>
