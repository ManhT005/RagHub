<nz-layout class="app-shell">
  <nz-sider nzCollapsible [nzWidth]="248" [nzTrigger]="null">
    <a class="brand" routerLink="/" aria-label="RagHub overview">
      <span class="brand-mark">R</span>
      <span>
        <strong>RagHub</strong>
        <small>Knowledge operations</small>
      </span>
    </a>

    <ul nz-menu nzTheme="dark" nzMode="inline" aria-label="Primary navigation">
      <li nz-menu-item nzMatchRouter routerLinkActive="ant-menu-item-selected">
        <a routerLink="/"><nz-icon nzType="dashboard" />Overview</a>
      </li>
      <li nz-menu-item nzMatchRouter routerLinkActive="ant-menu-item-selected">
        <a routerLink="/workspaces"><nz-icon nzType="database" />Workspaces</a>
      </li>
      <li nz-menu-item nzMatchRouter routerLinkActive="ant-menu-item-selected">
        <a routerLink="/documents"><nz-icon nzType="file-text" />Documents</a>
      </li>
      <li nz-menu-item nzDisabled><nz-icon nzType="message" />Chatbots</li>
    </ul>
  </nz-sider>

  <nz-layout>
    <nz-header>
      <div>
        <span class="eyebrow">ADMIN CONSOLE</span>
        <strong>Foundation workspace</strong>
      </div>
      <a class="phase-badge" routerLink="/auth"><nz-icon nzType="cloud-server" />Account</a>
    </nz-header>
    <nz-content>
      <router-outlet />
    </nz-content>
  </nz-layout>
</nz-layout>
