name: raghub
services:
  postgres:
    extends:
      file: docker-compose.base.yml
      service: postgres
    ports:
      - ${LOCAL_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432
  redis:
    extends:
      file: docker-compose.base.yml
      service: redis
    ports:
      - ${LOCAL_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379
  elasticsearch:
    extends:
      file: docker-compose.base.yml
      service: elasticsearch
    ports:
      - ${LOCAL_BIND_ADDRESS:-127.0.0.1}:${ELASTICSEARCH_PORT:-9200}:9200
  minio:
    extends:
      file: docker-compose.base.yml
      service: minio
    ports:
      - ${LOCAL_BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000
      - ${LOCAL_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001
  ollama:
    extends:
      file: docker-compose.base.yml
      service: ollama
    ports:
      - ${LOCAL_BIND_ADDRESS:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434
  ollama-init:
    extends:
      file: docker-compose.base.yml
      service: ollama-init
  api:
    extends:
      file: docker-compose.base.yml
      service: api
    ports:
      - ${LOCAL_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000
    image: ${LOCAL_IMAGE_PREFIX:-raghub}/backend:${LOCAL_IMAGE_TAG:-local}
    pull_policy: build
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: ${BACKEND_IMAGE_TARGET:-runtime}
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --reload
      - --reload-dir
      - /app/app
      - --reload-dir
      - /app/raghub_core
    environment:
      WATCHFILES_FORCE_POLLING: 'true'
    volumes:
      - ../backend/app:/app/app
      - ../raghub-core/src/raghub_core:/app/raghub_core
  worker:
    extends:
      file: docker-compose.base.yml
      service: worker
    image: ${LOCAL_IMAGE_PREFIX:-raghub}/backend:${LOCAL_IMAGE_TAG:-local}
    pull_policy: never
    command:
      - watchfiles
      - --filter
      - python
      - celery -A app.infrastructure.task_queue.celery_app:celery_app worker --loglevel=INFO --hostname=rag@%h --queues=rag-ingestion,rag-embedding,rag-reindex
      - /app/app
      - /app/raghub_core
    environment:
      WATCHFILES_FORCE_POLLING: 'true'
    volumes:
      - ../backend/app:/app/app
      - ../raghub-core/src/raghub_core:/app/raghub_core
  worker-provider:
    extends:
      file: docker-compose.base.yml
      service: worker-provider
    image: ${LOCAL_IMAGE_PREFIX:-raghub}/backend:${LOCAL_IMAGE_TAG:-local}
    pull_policy: never
    command:
      - watchfiles
      - --filter
      - python
      - celery -A app.infrastructure.task_queue.celery_app:celery_app worker --loglevel=INFO --concurrency=1 --hostname=provider@%h --queues=rag-provider,celery
      - /app/app
      - /app/raghub_core
    environment:
      WATCHFILES_FORCE_POLLING: 'true'
    volumes:
      - ../backend/app:/app/app
      - ../raghub-core/src/raghub_core:/app/raghub_core
  worker-ocr:
    extends:
      file: docker-compose.base.yml
      service: worker-ocr
    image: ${LOCAL_IMAGE_PREFIX:-raghub}/backend:${LOCAL_IMAGE_TAG:-local}-ocr
    pull_policy: build
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: ${OCR_BACKEND_IMAGE_TARGET:-ocr}
    volumes:
      - ../backend/app:/app/app
      - ../raghub-core/src/raghub_core:/app/raghub_core

  admin-web:
    extends:
      file: docker-compose.base.yml
      service: admin-web
    image: ${LOCAL_IMAGE_PREFIX:-raghub}/admin-web:${LOCAL_IMAGE_TAG:-local}
    pull_policy: build
    build:
      context: ..
      dockerfile: apps/admin-web/Dockerfile
      target: development
    volumes:
      - ../apps/admin-web/src:/repo/apps/admin-web/src
      - ../assets/providers:/repo/assets/providers:ro
      - ../apps/admin-web/angular.json:/repo/apps/admin-web/angular.json:ro
      - ../apps/admin-web/proxy.json:/repo/apps/admin-web/proxy.json:ro
      - ../apps/admin-web/tsconfig.json:/repo/apps/admin-web/tsconfig.json:ro
      - ../apps/admin-web/tsconfig.app.json:/repo/apps/admin-web/tsconfig.app.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:4200/ || exit 1
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20
  chat-widget:
    extends:
      file: docker-compose.base.yml
      service: chat-widget
    image: ${LOCAL_IMAGE_PREFIX:-raghub}/chat-widget:${LOCAL_IMAGE_TAG:-local}
    pull_policy: build
    build:
      context: ../apps/chat-widget
  widget-demo:
    extends:
      file: docker-compose.base.yml
      service: widget-demo
    ports:
      - ${LOCAL_BIND_ADDRESS:-127.0.0.1}:${WIDGET_DEMO_PORT:-8081}:80
    image: ${LOCAL_IMAGE_PREFIX:-raghub}/widget-demo:${LOCAL_IMAGE_TAG:-local}
    pull_policy: build
    build:
      context: ../apps/chat-widget/demo
  nginx:
    extends:
      file: docker-compose.base.yml
      service: nginx
    ports:
      - ${LOCAL_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80
    image: ${LOCAL_IMAGE_PREFIX:-raghub}/gateway:${LOCAL_IMAGE_TAG:-local}
    pull_policy: build
    build:
      context: ./nginx
    volumes:
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
  migrate:
    extends:
      file: docker-compose.base.yml
      service: migrate
    image: ${LOCAL_IMAGE_PREFIX:-raghub}/backend:${LOCAL_IMAGE_TAG:-local}
    pull_policy: never
    volumes:
      - ../backend/app:/app/app
      - ../backend/alembic:/app/alembic
      - ../backend/alembic.ini:/app/alembic.ini:ro
volumes:
  postgres-data: {}
  redis-data: {}
  elasticsearch-data: {}
  minio-data: {}
  ollama-data: {}
  huggingface-cache: {}
