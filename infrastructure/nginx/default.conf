upstream raghub_api {
    server api:8000;
}

upstream raghub_admin {
    server admin-web:80;
}

upstream raghub_widget { server chat-widget:80; }
upstream raghub_demo { server widget-demo:80; }

map $uri $safe_uri {
    default $uri;
    ~^/api/v1/public/chatbots/[^/]+(?<public_suffix>/.*)?$ /api/v1/public/chatbots/REDACTED$public_suffix;
}
log_format safe_access '$remote_addr $request_method $safe_uri $status '
                       'request_id=$request_id latency=$request_time';

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;
    access_log /var/log/nginx/access.log safe_access;

    location ^~ /api/v1/public/chatbots/ {
        client_max_body_size 16k;
        proxy_pass http://raghub_api;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 610s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Default error logs include the full request URI, which contains the embed key.
        error_log /dev/null;
    }

    location /api/ {
        proxy_pass http://raghub_api;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        # Local models can need more than Nginx's 60s default before their first token.
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /health/ {
        proxy_pass http://raghub_api;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /widget/raghub.js {
        charset utf-8;
        charset_types application/javascript text/javascript;
        proxy_pass http://raghub_widget/raghub.js;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location /demo/ { proxy_pass http://raghub_demo/; }

    location / {
        proxy_pass http://raghub_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
