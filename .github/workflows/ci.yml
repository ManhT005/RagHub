name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect backend manifest
        id: backend
        shell: bash
        run: |
          if [[ -f backend/requirements.lock && -f backend/pyproject.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Backend has not been initialized yet; check is bootstrap-safe."
          fi

      - name: Set up Python
        if: steps.backend.outputs.present == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install backend dependencies
        if: steps.backend.outputs.present == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Lint backend
        if: steps.backend.outputs.present == 'true'
        working-directory: backend
        run: python -m ruff check .

      - name: Test backend
        if: steps.backend.outputs.present == 'true'
        working-directory: backend
        run: python -m pytest -p no:cacheprovider

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect frontend manifest
        id: frontend
        shell: bash
        run: |
          if [[ -f apps/admin-web/package.json && -f apps/admin-web/package-lock.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Frontend has not been initialized yet; check is bootstrap-safe."
          fi

      - name: Set up Node.js
        if: steps.frontend.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json

      - name: Install frontend dependencies
        if: steps.frontend.outputs.present == 'true'
        working-directory: apps/admin-web
        run: npm ci --ignore-scripts

      - name: Test frontend
        if: steps.frontend.outputs.present == 'true'
        working-directory: apps/admin-web
        run: npm test

      - name: Build frontend
        if: steps.frontend.outputs.present == 'true'
        working-directory: apps/admin-web
        run: npm run build

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          if [[ -f infrastructure/docker-compose.yml ]]; then
            docker compose -f infrastructure/docker-compose.yml config --quiet
          else
            echo "Docker Compose has not been initialized yet; check is bootstrap-safe."
          fi

  migration:
    name: Database migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_DB: raghub_ci
          POSTGRES_USER: raghub
          POSTGRES_PASSWORD: raghub-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raghub -d raghub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://raghub:raghub-ci-only@localhost:5432/raghub_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect migration configuration
        id: migration
        shell: bash
        run: |
          if [[ -f backend/alembic.ini && -f backend/requirements.lock ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Database migrations have not been initialized yet; check is bootstrap-safe."
          fi

      - name: Set up Python
        if: steps.migration.outputs.present == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install migration dependencies
        if: steps.migration.outputs.present == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Apply database migration
        if: steps.migration.outputs.present == 'true'
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Verify migration matches models
        if: steps.migration.outputs.present == 'true'
        working-directory: backend
        run: python -m alembic check
