name: Docker images

on:
  workflow_call:
    inputs:
      publish:
        description: Publish checked images to GHCR
        required: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Image ${{ matrix.image }}${{ matrix.suffix }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
            target: runtime
            suffix: ""
          - image: backend
            context: backend
            target: local-ai
            suffix: -local-ai
          - image: admin-web
            context: apps/admin-web
            target: runtime
            suffix: ""
          - image: chat-widget
            context: apps/chat-widget
            target: runtime
            suffix: ""
          - image: widget-demo
            context: apps/chat-widget/demo
            target: runtime
            suffix: ""
          - image: gateway
            context: infrastructure/nginx
            target: runtime
            suffix: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release comes from main
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Derive registry path
        id: registry
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.registry.outputs.prefix }}/${{ matrix.image }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images and publish when authorized
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}${{ matrix.suffix }}
          provenance: mode=max
          sbom: true
