name: RAG nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

concurrency:
  group: rag-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    name: Nightly RAG gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RAGHUB_TEST_BASE_URL: http://localhost:8000
      RAGHUB_TEST_DATABASE_URL: postgresql+asyncpg://raghub:raghub-local-only@127.0.0.1:5432/raghub
      RAGHUB_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      RAGHUB_TEST_ELASTICSEARCH_URL: http://127.0.0.1:9200
      RAGHUB_TEST_S3_ENDPOINT: http://127.0.0.1:9000
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements.lock
      - name: Start services
        run: docker compose -f infrastructure/docker-compose.yml up -d --build --wait api worker worker-provider nginx
      - name: Apply migrations
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Integration suite
        working-directory: backend
        run: python -m pytest -p no:cacheprovider -m integration
      - name: Real OCR runtime smoke
        run: |
          docker build --target ocr -t raghub-nightly-ocr -f backend/Dockerfile .
          docker run --rm -i raghub-nightly-ocr python - < backend/scripts/verify_ocr_runtime.py
      - name: Golden baseline report (compare-only, never blocks on thresholds)
        working-directory: backend
        run: python scripts/rag_golden_eval.py --out ../artifacts/rag_nightly_baseline.json
      - name: Index GC dry-run audit
        working-directory: backend
        run: python -m app.cli index-gc
      - name: Seed contract scope and run Postman collection
        run: |
          python backend/scripts/seed_contract_env.py --base-url http://localhost:8000 \
            --email nightly@example.com --password nightly-only-01 \
            --out /tmp/contract-env.json
          BASE_URL=http://localhost:8000 POSTMAN_ENV=/tmp/contract-env.json bash postman/run.sh
      - name: Collect service logs on failure
        if: failure()
        run: docker compose -f infrastructure/docker-compose.yml logs --no-color --tail=200
      - name: Stop test services
        if: always()
        run: docker compose -f infrastructure/docker-compose.yml down --volumes
