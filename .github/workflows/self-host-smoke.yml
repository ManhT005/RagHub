name: Self-host smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    tags: ['v*.*.*-rc*']

permissions:
  contents: read

concurrency:
  group: self-host-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-host-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install smoke client
        run: python -m pip install httpx==0.28.1
      - name: Generate disposable installation secrets
        run: python scripts/self-host-test-env.py
      - name: Build CPU installation
        run: >-
          docker compose --env-file .env.selfhost-test -p raghub-selfhost-test
          -f infrastructure/docker-compose.self-host.yml
          -f infrastructure/docker-compose.self-host.build.yml
          --profile local-ai build api admin-web chat-widget widget-demo nginx
      - name: Start installation
        run: >-
          docker compose --env-file .env.selfhost-test -p raghub-selfhost-test
          -f infrastructure/docker-compose.self-host.yml
          -f infrastructure/docker-compose.self-host.build.yml
          --profile local-ai up -d --wait --wait-timeout 240 api worker worker-provider nginx ollama
      - name: Install browser acceptance tooling
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Fresh browser setup, expiry, restore, outage and logout
        run: >-
          python scripts/self-host-auth-browser.py --base-url http://localhost:18082
          --owner-file .env.selfhost-owner.json --initialize --auth-expiry-seconds 65
          --output .backups/browser-auth
      - name: API auth expiry and local RAG plus restart persistence
        run: >-
          python scripts/self-host-smoke.py --env-file .env.selfhost-test
          --project raghub-selfhost-test --base-url http://localhost:18082
          --owner-file .env.selfhost-owner.json --state-file .env.selfhost-state.json
          --compose-override infrastructure/docker-compose.self-host.build.yml
          --existing-setup --restart --auth-expiry-seconds 65
      - name: Back up installed data, secrets and model cache
        run: >-
          python scripts/self-host-ops.py backup --env-file .env.selfhost-test
          --project raghub-selfhost-test --directory .backups/smoke
          --compose-override infrastructure/docker-compose.self-host.build.yml --include-models
      - name: Prepare a different installation target
        run: |
          python - <<'PY'
          from pathlib import Path
          original = Path('.backups/smoke/runtime.env').read_text()
          target = original.replace('18082', '18083').replace('172.31.83.', '172.31.84.')
          Path('.env.selfhost-restore').write_text(target)
          Path('.env.selfhost-restore').chmod(0o600)
          PY
          docker compose --env-file .env.selfhost-test -p raghub-selfhost-test -f infrastructure/docker-compose.self-host.yml -f infrastructure/docker-compose.self-host.build.yml --profile local-ai stop
      - name: Restore into a fresh project
        run: >-
          python scripts/self-host-ops.py restore --env-file .env.selfhost-restore
          --project raghub-selfhost-restore --directory .backups/smoke
          --compose-override infrastructure/docker-compose.self-host.build.yml
      - name: Verify restored owner, objects, index and local chat
        run: >-
          python scripts/self-host-smoke.py --env-file .env.selfhost-restore
          --project raghub-selfhost-restore --base-url http://localhost:18083
          --owner-file .env.selfhost-owner.json --state-file .env.selfhost-state.json
          --compose-override infrastructure/docker-compose.self-host.build.yml --verify-only
      - name: Capture diagnostic logs
        if: failure()
        run: >-
          docker compose --env-file .env.selfhost-test -p raghub-selfhost-test
          -f infrastructure/docker-compose.self-host.yml
          -f infrastructure/docker-compose.self-host.build.yml
          --profile local-ai logs --no-color --tail 100 api worker worker-provider nginx ollama
      - name: Remove disposable installation
        if: always()
        run: >-
          docker compose --env-file .env.selfhost-test -p raghub-selfhost-test
          -f infrastructure/docker-compose.self-host.yml
          -f infrastructure/docker-compose.self-host.build.yml
          --profile local-ai down -v --remove-orphans
      - name: Remove restored test installation
        if: always()
        run: |
          if [ -f .env.selfhost-restore ]; then
            docker compose --env-file .env.selfhost-restore -p raghub-selfhost-restore -f infrastructure/docker-compose.self-host.yml -f infrastructure/docker-compose.self-host.build.yml --profile local-ai down -v --remove-orphans
          fi
