name: Bug report
description: Report reproducible behavior that differs from the expected result.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve RagHub. Do not include credentials, tokens, or private documents.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Backend API
        - Ingestion worker
        - Search / retrieval
        - Admin frontend
        - Chat widget
        - Docker / infrastructure
        - Database migration
        - Documentation
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the stack with ...
        2. Send a request to ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Python/Node versions, deployment profile, and relevant image tags.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets and tenant data before attaching evidence.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and private data from this report.
          required: true
