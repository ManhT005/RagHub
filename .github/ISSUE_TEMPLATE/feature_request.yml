name: Feature request
description: Propose a user-facing capability or engineering improvement.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operational problem should be solved?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and acceptance criteria.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Include API, data, UI, security, or migration implications when known.

  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      options:
        - P0 - MVP blocker
        - P1 - Important
        - P2 - Improvement
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I checked the project plan and existing issues for overlap.
          required: true
        - label: This request describes the problem separately from the implementation.
          required: true
